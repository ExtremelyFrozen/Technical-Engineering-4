[tools]
java = "21"

[tasks.build]
description = "构建项目"
run = "gradlew build"

[tasks.clean]
description = "清理并构建"
run = ["gradlew clean", "gradlew build"]

[tasks.run-client]
description = "启动 MC 客户端测试"
run = "gradlew runClient"

[tasks.test-server]
description = "运行服务端弱验证测试"
run = "gradlew runAdapterTestServer"
