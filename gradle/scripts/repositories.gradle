repositories {
    mavenLocal()
    mavenCentral()
    // force gradle to download FastUtil & LWJGL from the central maven so we can get source artifacts
    exclusiveContent { // Force
        forRepository { mavenCentral() }
        filter {
            includeGroup("it.unimi.dsi")
            includeGroup("org.lwjgl")
            includeGroup("com.google.guava")
            includeGroup("io.netty")
            includeGroup("dev.vfyjxf")
            includeGroup("net.mezzdev")
            includeGroup("org.jetbrains")
            includeGroup("org.jetbrains.kotlin")
        }
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release/"
    }
    exclusiveContent { // JEI
        forRepository {
            maven {
                name = "Jared's Maven"
                url = "https://maven.blamejared.com/"
            }
        }
        filter {
            includeGroup("mezz.jei")
            includeGroup("net.mezzdev.config")
        }
    }
    maven { // JEI mirror, AE2 (fallback)
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    exclusiveContent { // LDLib2
        forRepository {
            maven {
                name = "FirstDarkDev Maven"
                url = "https://maven.firstdark.dev/snapshots"
            }
        }
        filter { includeGroup("com.lowdragmc.ldlib2") }
    }
    exclusiveContent { // Lombok must come from Maven Central, not NeoForge's repo
        forRepository { mavenCentral() }
        filter { includeGroup("org.projectlombok") }
    }
    exclusiveContent { // tterrag - registrate（1.21.1 线只发布在 Gegy 的 maven；旧的 devos snapshots 已无引用）
        forRepository { maven { url = "https://maven.gegy.dev/releases/" } }
        filter { includeGroup("com.tterrag.registrate") }
    }
    exclusiveContent { // terraformers - EMI
        forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
        filter { includeGroup("dev.emi") }
    }
    exclusiveContent { // Modrinth Maven
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
    exclusiveContent { // Curseforge Maven
        forRepository { maven { url = "https://cursemaven.com" } }
        filter { includeGroup("curse.maven") }
    }
    exclusiveContent { // Architectury
        forRepository { maven { url = "https://maven.architectury.dev/" } }
        filter { includeGroup("dev.architectury") }
    }
    exclusiveContent { // KubeJS + Rhino + 其传递依赖（latvian maven）
        forRepository {
            maven {
                name = "Latvian Maven"
                url = "https://maven.latvian.dev/releases"
            }
        }
        // 除 dev.latvian.mods 外还有 dev.latvian.apps:tiny-java-server 等传递依赖
        filter { includeGroupByRegex("dev\\.latvian\\..*") }
    }
    exclusiveContent { // KubeJS 的 animated-gif-lib 只发布在 JitPack（版本号带前缀，非语义版本）
        forRepository {
            maven {
                name = "JitPack"
                url = "https://jitpack.io"
            }
        }
        filter { includeGroup("com.github.rtyley") }
    }
    exclusiveContent { // Cloth Config (shedaniel)
        forRepository { maven { url = "https://maven.shedaniel.me/" } }
        filter { includeGroup("me.shedaniel.cloth") }
    }
}
