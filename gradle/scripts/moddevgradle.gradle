neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    accessTransformers {
        var file = project.file('src/main/resources/META-INF/accesstransformer.cfg')
        from(file)
        publish(file)
    }
    validateAccessTransformers = true

//    interfaceInjectionData {
//        var file = project.file('injected_interfaces/interfaces.json')
//        from(file)
//        publish file
//    }
//
//    interfaceInjectionData = project.files('injected_interfaces/interfaces.json')

    addModdingDependenciesTo(sourceSets.client)
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.extra)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
            sourceSet(sourceSets.test)
            sourceSet(sourceSets.extra)
            sourceSet(sourceSets.clientExtra)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.clientExtra
            ideName = "Client"


            gameDirectory.set(file('run/client'))
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        }

        server {
            server()
            sourceSet = sourceSets.extra
            ideName = "Server"

            gameDirectory.set(file('run/server'))
            programArguments.addAll('--nogui', '--world', 'world-extra')
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
        }

        // 此运行配置启动 GameTestServer，执行所有已注册的 GameTest 后退出。
        // 默认情况下，没有 GameTest 时服务器会崩溃。
        // 其他运行配置默认也启用 GameTest 系统，可通过 /test 命令触发。
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            ideName = "Game Tests"

            gameDirectory.set(file('run/gametest/server'))
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
            environment('TEST', 'true')
        }

        gameTestClient {
            client()
            sourceSet = sourceSets.test
            ideName = "Game Tests (Client)"

            gameDirectory.set(file('run/gametest/client'))
            systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
            environment('TEST', 'true')
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = "Data Generation"

            gameDirectory.set(file('run/data'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
        }

        // 以下设置应用于上方所有运行配置。
        configureEach {
            // 日志标记可按需增删，多个标记用逗号分隔。
            // "SCAN"：模组扫描。
            // "REGISTRIES"：注册表事件。
            // "REGISTRYDUMP"：注册表内容。
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // 开发环境启用本模组类的断言。
            jvmArgument('-ea:com.modularmc.ten...')

            // 控制台日志级别；级别说明见：
            // https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
