String getConfig(String key) {
    return project.properties.get(key)
}

def mod_id = getConfig("mod_id")
def version = getConfig("version")
def mod_license = getConfig("mod_license")
def mod_name = getConfig("mod_name")
def mod_description = getConfig("mod_description")
def mod_url = getConfig("mod_url")
def mod_issue_tracker = getConfig("mod_issue_tracker")

String suffix = System.getenv("VERSION_SUFFIX")
String version_toml = "$version" + (suffix ? "+$suffix" : "")

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}

// Create run-folders for non-client configs to avoid pollution of dev envs
tasks.matching { it.name.startsWith('prepare') }.configureEach {
    def baseDir = layout.projectDirectory.asFile
    doFirst {
        new File(baseDir, "run/client").mkdirs()
        new File(baseDir, "run/server").mkdirs()
        new File(baseDir, "run/gametest").mkdirs()
        new File(baseDir, "run/data").mkdirs()
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var neoVersion = libs.versions.neoForge.get()
    neoVersion = neoVersion.substring(0, neoVersion.lastIndexOf('.'))
    // Configuration 无 26.1.2 坐标，已禁用；后续迁移到 ModConfigSpec
    var configurationVersion = "0.0.0" // placeholder — 迁移 ModConfigSpec 后移除
    var replaceProperties = [
            version                 : version_toml,
            mod_id                  : mod_id,
            minecraft_version       : "[26.1.2, 26.1.2]",
            loader_version          : libs.versions.loader.get(),
            neo_version             : neoVersion,
            configuration_version   : configurationVersion,
            mod_license             : mod_license,
            mod_name                : mod_name,
            mod_description         : mod_description,
            mod_url                 : mod_url,
            mod_issue_tracker       : mod_issue_tracker
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata