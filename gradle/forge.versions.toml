registrate = "MC1.21-1.3.0+67"

jei = "19.39.0.372"
emi = "1.1.22+1.21.1"


## modrinth maven ##
jade = "15.10.0+neoforge"
sodium = "mc1.21.1-0.6.13-neoforge"
iris = "1.8.8+1.21.1-neoforge"
modernfix = "4SPHwiDB" # 5.24.3+mc1.21.1
modernui = "3.12.0.2"
ae2 = "19.2.17" # AE2 19.2.17 仅在 Modrinth maven；modmaven 的 appeng 坐标止步 19.2.0-beta
guideme = "21.1.15" # AE2 硬前置 REQUIRED [21.1.1,)；Powah 指南书 REQUIRED [21.1.7,)（生效下限 21.1.7）

## curseforge maven ##
spark = "6225208"
# AE2 自 1.21 起不再自带 JEI 集成（官方转用 EMI），由该桥接模组补回；坐标 = CurseForge 项目 1074338 / 文件 7727898（1.2.1）
ae2jeiintegration = "7727898"

## libs ##


[libraries]
ldlib2              = { module = "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1", version.ref = "ldlib2" }
