## libs ##


[libraries]
ldlib2              = { module = "com.lowdragmc.ldlib2:ldlib2-neoforge-26.1", version.ref = "ldlib2" }
# 以下依赖无 26.1.2 可用坐标，已禁用 —— Phase 1+ 迁移后恢复
# registrate          = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }
# configuration       = { module = "dev.toma.configuration:configuration-1.21.1", version.ref = "configuration" }

# JEI 29.x 26.1.2 合并为单 artifact
jei-common-api      = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }
jei-neoforge-api    = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }
jei-neoforge-impl   = { module = "mezz.jei:jei-26.1.2-neoforge", version.ref = "jei" }
# Phase 4/5: EMI 等可选依赖
# emi                 = { module = "dev.emi:emi-neoforge", version.ref = "emi" }

# Phase 4/5: Modrinth 可选 deps
# jade                = { module = "maven.modrinth:jade", version.ref = "jade" }
# sodium              = { module = "maven.modrinth:sodium", version.ref = "sodium" }
# iris                = { module = "maven.modrinth:iris", version.ref = "iris" }
# modernui            = { module = "maven.modrinth:modern-ui", version.ref = "modernui" }
# modernfix           = { module = "maven.modrinth:modernfix", version.ref = "modernfix" }

# Phase 4/5: CurseForge 可选 deps
# spark               = { module = "curse.maven:spark-361579", version.ref = "spark" }
[bundles]
jei = ["jei-common-api", "jei-neoforge-api", "jei-neoforge-impl"]