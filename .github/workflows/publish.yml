name: Publish Version

on:
  workflow_call:
    inputs:
      simulate:
        required: false
        type: boolean
      tag-name:
        description: 'Tag to build from and upload to'
        required: true
        type: string
      version:
        description: 'Version identifier; 1.21'
        required: true
        type: string
      release-body:
        description: 'Body for published release notes'
        required: false
        type: string
      changelog-body:
        description: 'Body of change notes to insert into CHANGELOG.md'
        required: false
        type: string

jobs:
  build:
    name: Build and Publish to Maven
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: 'true'
    outputs:
      ver: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name }}
      - name: Setup Build
        uses: ./.github/actions/build_setup
        with:
          ref: ${{ inputs.tag-name }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Get Version
        id: ver
        run: echo "version=$(./gradlew -q printVersion)" >> $GITHUB_OUTPUT
      - name: Build
        run: ./gradlew assemble
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
          path: build/libs/*
          if-no-files-found: error
          retention-days: 3
      - name: Publish
        if: ${{ !inputs.simulate }}
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish

  upload-release-artifacts:
    name: Upload Artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          files: ./*.jar
          fail_on_unmatched_files: true

  publish-modrinth:
    name: Publish to Modrinth
    needs: build
    if: ${{ !inputs.simulate }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Publish Mod
        env:
          MC_VERSION: '1.21.1'
          LOADER: 'neoforge'
          JAVA: '21'
          VERSION_TYPE: 'release'
        uses: Kir-Antipov/mc-publish@v3.3.0
        with:
          modrinth-id: PS4p8SFk
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            ./kenergyengineering-${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}.jar
            ./!(kenergyengineering-${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}.jar)
          name: 'Kenergy Engineering Retechnicalized ${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}'
          version: 'mc${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}'
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ inputs.release-body }}
          loaders: ${{ env.LOADER }}
          java: ${{ env.JAVA }}
          fail-mode: fail

  publish-cf:
    name: Publish to CF
    needs: build
    if: ${{ !inputs.simulate }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ inputs.tag-name }}
      - name: Publish Mod
        env:
          MC_VERSION: '1.21.1'
          LOADER: 'neoforge'
          JAVA: '21'
          VERSION_TYPE: 'release'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1545758
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          environment: 'client | server'
          files: |
            ./kenergyengineering-${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}.jar
            ./!(kenergyengineering-${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}.jar)
          name: 'Kenergy Engineering Retechnicalized ${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}'
          version: 'mc${{ env.MC_VERSION }}-${{ needs.build.outputs.ver }}'
          version-type: ${{ env.VERSION_TYPE }}
          changelog: ${{ inputs.release-body }}
          loaders: ${{ env.LOADER }}
          java: ${{ env.JAVA }}
          fail-mode: fail

  # After successful release, PR version bump and changelog
  bump-version-and-changelog:
    name: Bump Version and Build Changelog
    needs: [ build, upload-release-artifacts ]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag-name }}
      - name: Bump Version
        env:
          VERSION: ${{ needs.build.outputs.ver }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C gh/release-${{ inputs.version }}
          BUMPED=$(echo "$VERSION" | awk -F. '/[0-9]+\./{$NF++;print}' OFS=.)
          sed -i "s/= $VERSION/= ${BUMPED}/" gradle.properties
          if git diff --quiet -- gradle.properties; then
            echo "::error::gradle.properties did not change; check mod_version format."
            exit 1
          fi
          git commit -am "Bump version to ${BUMPED}"
      - name: Prepend to CHANGELOG
        if: inputs.changelog-body
        env:
          VERSION: ${{ needs.build.outputs.ver }}
          CHANGELOG_BODY: ${{ inputs.changelog-body }}
          TZ: Asia/Shanghai
        run: |
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty; skip generated changelog."
            exit 0
          fi
          python3 - <<'PY'
          import os
          import re
          from datetime import date
          from pathlib import Path

          version = os.environ["VERSION"]
          body = os.environ["CHANGELOG_BODY"].strip()
          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")

          if f"## [{version}]" in text or f"## Version [v{version}]" in text:
              print(f"CHANGELOG.md already contains [{version}]; skip generated notes.")
              raise SystemExit(0)

          if not body:
              print("empty changelog body; skip generated notes.")
              raise SystemExit(0)

          if not re.search(r"^- ", body, flags=re.M):
              print("generated body has no entries; skip generated notes.")
              raise SystemExit(0)

          today = date.today().isoformat()
          body = re.sub(r"^## Version \[v([^\]]+)\]\([^)]*\)[ \t]*$", r"## [\1] - " + today, body, flags=re.M)
          body = re.sub(r"^## \[([^\]]+)\](?!\s*-\s*\d{4}-\d{2}-\d{2})[ \t]*$", r"## [\1] - " + today, body, flags=re.M)
          for en, zh in (("### Added", "### 新增"), ("### Fixed", "### 修复"), ("### Changed", "### 改进")):
              body = body.replace(en, zh)
          if not re.search(r"^## \[", body, flags=re.M):
              body = f"## [{version}] - {today}\n\n" + body

          marker = "<!-- CHANGELOG_INSERT -->"
          if marker not in text:
              raise SystemExit(f"missing marker in CHANGELOG.md: {marker}")

          text = text.replace(marker, marker + "\n\n" + body, 1)
          path.write_text(text, encoding="utf-8")
          print(f"inserted generated notes for [{version}]")
          PY
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; skip commit."
          else
            git commit -am "Updated CHANGELOG"
          fi
      - name: Push and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force --set-upstream origin gh/release-${{ inputs.version }}
          gh pr create -B ${{ inputs.version }} -H gh/release-${{ inputs.version }} --title "RELEASE for ${{ inputs.version }} [no-snapshot]" --body "Created by GH Workflow" --label "ignore changelog"
